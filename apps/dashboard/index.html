<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBSCURA Dashboard</title>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/react.production.min.js"></script>
  <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'IBM Plex Mono', monospace;
      min-height: 100vh;
    }
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      border-bottom: 1px solid #222;
    }
    nav .title {
      font-size: 20px;
      font-weight: bold;
      color: #00d9ff;
    }
    nav button {
      background: #00d9ff;
      color: #000;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 30px;
      border-bottom: 1px solid #222;
      padding-bottom: 12px;
    }
    .tab-btn {
      background: transparent;
      color: #666;
      border: none;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      font-family: inherit;
    }
    .tab-btn.active {
      background: #00d9ff20;
      color: #00d9ff;
    }
    h2 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    .jobs-grid {
      display: grid;
      gap: 12px;
    }
    .job-card {
      background: #1a1a1a;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 16px;
    }
    .job-card.running {
      border-color: #ffa50055;
    }
    .job-card.completed {
      border-color: #00d9ff55;
    }
    .job-url {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 4px;
    }
    .job-meta {
      font-size: 11px;
      color: #888;
      margin-bottom: 8px;
    }
    .status-badge {
      font-weight: bold;
      font-size: 11px;
    }
    .status-running {
      color: #ffa500;
    }
    .status-completed {
      color: #00d9ff;
    }
    .status-queued {
      color: #666;
    }
    .progress-bar {
      background: #0a0a0a;
      height: 4px;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-fill {
      height: 100%;
      background: currentColor;
      transition: width 0.3s ease;
    }
    .job-actions {
      display: flex;
      gap: 8px;
    }
    .btn {
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      font-family: inherit;
    }
    .btn-download {
      background: #00d9ff;
      color: #000;
    }
    .btn-delete {
      background: #ff4444;
      color: #fff;
    }
    .create-form {
      max-width: 600px;
      background: #1a1a1a;
      border: 1px solid #222;
      border-radius: 8px;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 12px;
      color: #888;
      margin-bottom: 8px;
    }
    .form-input {
      width: 100%;
      background: #0a0a0a;
      border: 1px solid #333;
      color: #fff;
      padding: 10px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 12px;
    }
    .checkbox-group {
      margin-bottom: 8px;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-launch {
      width: 100%;
      background: #00d9ff;
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .results-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }
    .result-card {
      background: #0a0a0a;
      border: 1px solid #222;
      border-radius: 6px;
      padding: 12px;
    }
    .result-url {
      font-size: 11px;
      color: #888;
      margin-bottom: 6px;
    }
    .result-count {
      font-size: 18px;
      font-weight: bold;
      color: #00d9ff;
    }
    .logs-container {
      background: #0a0a0a;
      border: 1px solid #222;
      border-radius: 8px;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      max-height: 600px;
      overflow-y: auto;
      padding: 0;
    }
    .log-entry {
      padding: 8px 12px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      gap: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-entry:last-child {
      border-bottom: none;
    }
    .log-timestamp {
      color: #666;
      min-width: 90px;
      flex-shrink: 0;
    }
    .log-level {
      min-width: 65px;
      flex-shrink: 0;
      font-weight: bold;
    }
    .log-level.info {
      color: #00d9ff;
    }
    .log-level.debug {
      color: #888;
    }
    .log-level.success {
      color: #00ff88;
    }
    .log-level.error {
      color: #ff4444;
    }
    .log-msg {
      flex: 1;
    }
    .log-btn-clear {
      background: #ff4444;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      font-family: inherit;
    }
    .total-scraped {
      color: #888;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .db-status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #888;
    }
    .db-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #666;
    }
    .db-dot.connected {
      background: #00ff88;
      box-shadow: 0 0 6px #00ff8899;
    }
    .db-dot.error {
      background: #ff4444;
      box-shadow: 0 0 6px #ff444499;
    }
    .loading-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 60vh;
      color: #888;
      font-size: 13px;
    }
    .auth-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      padding: 20px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_URL = 'https://xunsrqeelmtgwpywdqlw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh1bnNycWVlbG10Z3dweXdkcWx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0NTkwOTUsImV4cCI6MjA5ODAzNTA5NX0.g_gdrOLRrjikA1eyRha0ut-ZpMeCvFrp2R9e9N4bwgU';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function relativeTime(iso) {
      const diffSec = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
      if (diffSec < 5) return 'now';
      if (diffSec < 60) return `${diffSec}s ago`;
      if (diffSec < 3600) return `${Math.floor(diffSec / 60)}min ago`;
      return `${Math.floor(diffSec / 3600)}h ago`;
    }

    function Dashboard() {
      const [session, setSession] = useState(null);
      const [authChecked, setAuthChecked] = useState(false);
      const [authMode, setAuthMode] = useState('signin');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [authError, setAuthError] = useState('');
      const [authNotice, setAuthNotice] = useState('');
      const [authBusy, setAuthBusy] = useState(false);

      const [jobs, setJobs] = useState([]);
      const [logs, setLogs] = useState([]);
      const [loading, setLoading] = useState(true);
      const [dbStatus, setDbStatus] = useState('connecting');
      const [url, setUrl] = useState('');
      const [tab, setTab] = useState('jobs');
      const logsEndRef = useRef(null);

      useEffect(() => {
        db.auth.getSession().then(({ data }) => {
          setSession(data.session);
          setAuthChecked(true);
        });
        const { data: listener } = db.auth.onAuthStateChange((_event, newSession) => {
          setSession(newSession);
        });
        return () => listener.subscription.unsubscribe();
      }, []);

      const signIn = async () => {
        setAuthBusy(true);
        setAuthError('');
        setAuthNotice('');
        const { error } = await db.auth.signInWithPassword({ email: authEmail, password: authPassword });
        if (error) setAuthError(error.message);
        setAuthBusy(false);
      };

      const signUp = async () => {
        setAuthBusy(true);
        setAuthError('');
        setAuthNotice('');
        const { data, error } = await db.auth.signUp({ email: authEmail, password: authPassword });
        if (error) {
          setAuthError(error.message);
        } else if (data.user && !data.session) {
          setAuthNotice('Account created. Check your email to confirm before signing in.');
        }
        setAuthBusy(false);
      };

      const signOut = async () => {
        await db.auth.signOut();
        setJobs([]);
        setLogs([]);
        setLoading(true);
      };

      const addLog = async (level, msg, jobId = null) => {
        setLogs(prev => [...prev, { timestamp: new Date().toLocaleTimeString(), level, msg }]);
        const { error } = await db.from('job_logs').insert({ job_id: jobId, level, message: msg });
        if (error) console.error('log insert failed:', error.message);
      };

      useEffect(() => {
        if (!session) {
          setLoading(false);
          return;
        }
        setLoading(true);
        async function loadInitial() {
          const [jobsRes, logsRes] = await Promise.all([
            db.from('jobs').select('*').order('created_at', { ascending: false }),
            db.from('job_logs').select('*').order('created_at', { ascending: true }).limit(200),
          ]);

          if (jobsRes.error || logsRes.error) {
            setDbStatus('error');
            setLoading(false);
            return;
          }

          setJobs(jobsRes.data.map(j => ({
            id: j.id,
            url: j.url,
            status: j.status,
            results: j.results,
            date: relativeTime(j.created_at),
            startedAt: new Date(j.started_at).getTime(),
          })));
          setLogs(logsRes.data.map(l => ({
            timestamp: new Date(l.created_at).toLocaleTimeString(),
            level: l.level,
            msg: l.message,
          })));
          setDbStatus('connected');
          setLoading(false);
        }
        loadInitial();
      }, [session]);

      useEffect(() => {
        if (!session) return;
        const interval = setInterval(() => {
          setJobs(prevJobs =>
            prevJobs.map(job => {
              if (job.status === 'queued') {
                addLog('info', `Started: ${job.url}`, job.id);
                addLog('debug', 'Initializing puppeteer...', job.id);
                db.from('jobs').update({ status: 'running' }).eq('id', job.id).then();
                return { ...job, status: 'running', date: 'now' };
              }
              if (job.status === 'running') {
                const elapsed = Date.now() - job.startedAt;
                const newResults = Math.min(job.results + Math.floor(Math.random() * 5) + 1, 500);
                const shouldComplete = elapsed > 20000 || Math.random() > 0.95;

                if (newResults % 50 === 0 && newResults !== job.results) {
                  addLog('debug', `Scraped ${newResults} items...`, job.id);
                }

                if (shouldComplete) {
                  addLog('success', `✓ Completed: ${newResults} items found in ${(elapsed / 1000).toFixed(1)}s`, job.id);
                  db.from('jobs').update({ status: 'completed', results: newResults, completed_at: new Date().toISOString() }).eq('id', job.id).then();
                  return {
                    ...job,
                    status: 'completed',
                    results: newResults,
                    date: 'now',
                  };
                }
                db.from('jobs').update({ results: newResults }).eq('id', job.id).then();
                return { ...job, results: newResults, date: 'now' };
              }
              return job;
            })
          );
        }, 1000);

        return () => clearInterval(interval);
      }, [session]);

      const addJob = async () => {
        if (!url) return;
        const { data, error } = await db.from('jobs').insert({ url, status: 'queued', results: 0 }).select().single();
        if (error) {
          addLog('error', `Failed to create job: ${error.message}`);
          return;
        }
        addLog('info', `Job queued: ${url}`, data.id);
        setJobs([{
          id: data.id,
          url: data.url,
          status: data.status,
          results: data.results,
          date: 'now',
          startedAt: new Date(data.started_at).getTime(),
        }, ...jobs]);
        setUrl('');
      };

      const deleteJob = async (id) => {
        setJobs(jobs.filter(j => j.id !== id));
        const { error } = await db.from('jobs').delete().eq('id', id);
        if (error) console.error('delete failed:', error.message);
      };

      const clearLogs = async () => {
        setLogs([]);
        const { error } = await db.from('job_logs').delete().neq('id', 0);
        if (error) console.error('clear logs failed:', error.message);
      };

      const generateFixtureRows = (job) => {
        const rows = [];
        for (let i = 1; i <= job.results; i++) {
          rows.push({
            id: i,
            source: job.url,
            title: `Item ${i} — ${job.url.replace(/^https?:\/\//, '').split('/')[0]}`,
            value: Math.floor(Math.random() * 900) + 100,
            scraped_at: job.date,
          });
        }
        return rows;
      };

      const triggerDownload = (content, filename, mimeType) => {
        const blob = new Blob([content], { type: mimeType });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(link.href);
      };

      const downloadJobJSON = (job) => {
        const rows = generateFixtureRows(job);
        const filename = `${job.url.replace(/[^a-z0-9]/gi, '_')}_${job.id}.json`;
        triggerDownload(JSON.stringify(rows, null, 2), filename, 'application/json');
        addLog('info', `Exported ${rows.length} items as JSON: ${filename}`, job.id);
      };

      const downloadJobCSV = (job) => {
        const rows = generateFixtureRows(job);
        const header = 'id,source,title,value,scraped_at';
        const csvRows = rows.map(r =>
          [r.id, r.source, `"${r.title}"`, r.value, r.scraped_at].join(',')
        );
        const csv = [header, ...csvRows].join('\n');
        const filename = `${job.url.replace(/[^a-z0-9]/gi, '_')}_${job.id}.csv`;
        triggerDownload(csv, filename, 'text/csv');
        addLog('info', `Exported ${rows.length} items as CSV: ${filename}`, job.id);
      };

      const exportAllJSON = () => {
        const allRows = jobs.filter(j => j.results > 0).flatMap(generateFixtureRows);
        triggerDownload(JSON.stringify(allRows, null, 2), 'obscura_export_all.json', 'application/json');
        addLog('info', `Exported all results as JSON (${allRows.length} items)`);
      };

      const exportAllCSV = () => {
        const allRows = jobs.filter(j => j.results > 0).flatMap(generateFixtureRows);
        const header = 'id,source,title,value,scraped_at';
        const csvRows = allRows.map(r =>
          [r.id, r.source, `"${r.title}"`, r.value, r.scraped_at].join(',')
        );
        const csv = [header, ...csvRows].join('\n');
        triggerDownload(csv, 'obscura_export_all.csv', 'text/csv');
        addLog('info', `Exported all results as CSV (${allRows.length} items)`);
      };

      if (!authChecked) {
        return (
          <div>
            <nav>
              <div className="title">OBSCURA DASHBOARD</div>
            </nav>
            <div className="loading-screen">Checking session...</div>
          </div>
        );
      }

      if (!session) {
        return (
          <div>
            <nav>
              <div className="title">OBSCURA DASHBOARD</div>
            </nav>
            <div className="auth-wrapper">
              <div className="create-form" style={{ maxWidth: '360px', width: '100%' }}>
                <h2 style={{ fontSize: '20px', marginBottom: '20px' }}>
                  {authMode === 'signin' ? 'Sign In' : 'Create Account'}
                </h2>
                <label className="form-label">Email</label>
                <input
                  className="form-input"
                  type="email"
                  value={authEmail}
                  onChange={e => setAuthEmail(e.target.value)}
                  placeholder="you@example.com"
                />
                <label className="form-label">Password</label>
                <input
                  className="form-input"
                  type="password"
                  value={authPassword}
                  onChange={e => setAuthPassword(e.target.value)}
                  placeholder="••••••••"
                  onKeyDown={e => e.key === 'Enter' && (authMode === 'signin' ? signIn() : signUp())}
                />
                {authError && <div style={{ color: '#ff4444', fontSize: '11px', marginBottom: '12px' }}>{authError}</div>}
                {authNotice && <div style={{ color: '#00ff88', fontSize: '11px', marginBottom: '12px' }}>{authNotice}</div>}
                <button
                  className="btn btn-download"
                  style={{ width: '100%', justifyContent: 'center', padding: '12px', marginBottom: '10px' }}
                  disabled={authBusy || !authEmail || !authPassword}
                  onClick={authMode === 'signin' ? signIn : signUp}
                >
                  {authBusy ? 'Please wait...' : authMode === 'signin' ? 'Sign In' : 'Sign Up'}
                </button>
                <button
                  style={{ width: '100%', background: 'transparent', color: '#888', border: 'none', cursor: 'pointer', fontSize: '11px', fontFamily: 'inherit' }}
                  onClick={() => {
                    setAuthMode(authMode === 'signin' ? 'signup' : 'signin');
                    setAuthError('');
                    setAuthNotice('');
                  }}
                >
                  {authMode === 'signin' ? "No account? Sign up" : 'Already have an account? Sign in'}
                </button>
              </div>
            </div>
          </div>
        );
      }

      if (loading) {
        return (
          <div>
            <nav>
              <div className="title">OBSCURA DASHBOARD</div>
              <button>⚙️ Settings</button>
            </nav>
            <div className="loading-screen">Connecting to Supabase...</div>
          </div>
        );
      }

      return (
        <div>
          <nav>
            <div className="title">OBSCURA DASHBOARD</div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '20px' }}>
              <div className="db-status">
                <span className={`db-dot ${dbStatus === 'connected' ? 'connected' : dbStatus === 'error' ? 'error' : ''}`}></span>
                {dbStatus === 'connected' ? 'Supabase connected' : dbStatus === 'error' ? 'Connection error' : 'Connecting...'}
              </div>
              <span style={{ fontSize: '11px', color: '#666' }}>{session.user.email}</span>
              <button onClick={signOut}>Sign Out</button>
              <button>⚙️ Settings</button>
            </div>
          </nav>

          <div className="container">
            <div className="tabs">
              {['jobs', 'create', 'results', 'logs'].map(t => (
                <button
                  key={t}
                  className={`tab-btn ${tab === t ? 'active' : ''}`}
                  onClick={() => setTab(t)}
                >
                  {t.toUpperCase()}
                </button>
              ))}
            </div>

            {tab === 'jobs' && (
              <div>
                <h2>Active Scrapes</h2>
                <div className="jobs-grid">
                  {jobs.map(job => {
                    const statusColor = job.status === 'completed' ? '#00d9ff' : job.status === 'running' ? '#ffa500' : '#666';
                    const progress = job.status === 'running' ? (job.results / 500) * 100 : job.status === 'completed' ? 100 : 0;

                    return (
                      <div key={job.id} className={`job-card ${job.status}`}>
                        <div className="job-url">{job.url}</div>
                        <div className="job-meta">
                          <span className={`status-badge status-${job.status}`}>{job.status.toUpperCase()}</span>
                          {' • '}{job.results} results • {job.date}
                        </div>
                        {job.status !== 'queued' && (
                          <div className="progress-bar">
                            <div
                              className="progress-fill"
                              style={{
                                width: `${progress}%`,
                                backgroundColor: statusColor,
                              }}
                            />
                          </div>
                        )}
                        <div className="job-actions">
                          <button
                            className="btn btn-download"
                            disabled={job.results === 0}
                            style={job.results === 0 ? { opacity: 0.4, cursor: 'not-allowed' } : {}}
                            onClick={() => job.results > 0 && downloadJobJSON(job)}
                          >
                            ⬇️ JSON
                          </button>
                          <button
                            className="btn btn-download"
                            disabled={job.results === 0}
                            style={job.results === 0 ? { opacity: 0.4, cursor: 'not-allowed' } : {}}
                            onClick={() => job.results > 0 && downloadJobCSV(job)}
                          >
                            ⬇️ CSV
                          </button>
                          <button
                            className="btn btn-delete"
                            onClick={() => deleteJob(job.id)}
                          >
                            ✕
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {tab === 'create' && (
              <div>
                <h2>New Scrape</h2>
                <div className="create-form">
                  <div className="form-group">
                    <label className="form-label">URL</label>
                    <input
                      className="form-input"
                      value={url}
                      onChange={e => setUrl(e.target.value)}
                      placeholder="https://reddit.com/r/..."
                    />
                  </div>
                  <div className="form-group">
                    <label className="form-label">Options</label>
                    <div className="checkbox-group">
                      <label className="checkbox-label">
                        <input type="checkbox" defaultChecked />
                        Stealth mode
                      </label>
                    </div>
                    <div className="checkbox-group">
                      <label className="checkbox-label">
                        <input type="checkbox" defaultChecked />
                        Wait until networkidle0
                      </label>
                    </div>
                  </div>
                  <button
                    className="btn-launch"
                    onClick={addJob}
                  >
                    ▶️ Launch Scrape
                  </button>
                </div>
              </div>
            )}

            {tab === 'results' && (
              <div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                  <h2 style={{ margin: 0 }}>Results</h2>
                  <div style={{ display: 'flex', gap: '8px' }}>
                    <button className="btn btn-download" onClick={exportAllJSON}>⬇️ Export All (JSON)</button>
                    <button className="btn btn-download" onClick={exportAllCSV}>⬇️ Export All (CSV)</button>
                  </div>
                </div>
                <div className="create-form">
                  <div className="total-scraped">Total scraped: {jobs.reduce((a, j) => a + j.results, 0)} items</div>
                  <div className="results-grid">
                    {jobs.filter(j => j.results > 0).map(job => (
                      <div key={job.id} className="result-card">
                        <div className="result-url">{job.url}</div>
                        <div className="result-count">{job.results}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {tab === 'logs' && (
              <div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '20px' }}>
                  <h2 style={{ margin: 0 }}>Execution Logs</h2>
                  <button
                    className="log-btn-clear"
                    onClick={clearLogs}
                  >
                    Clear Logs
                  </button>
                </div>
                <div className="logs-container" ref={logsEndRef}>
                  {logs.length === 0 ? (
                    <div className="log-entry">
                      <span className="log-msg" style={{ color: '#666' }}>No logs yet...</span>
                    </div>
                  ) : (
                    logs.map((log, idx) => (
                      <div key={idx} className="log-entry">
                        <span className="log-timestamp">{log.timestamp}</span>
                        <span className={`log-level ${log.level}`}>[{log.level.toUpperCase()}]</span>
                        <span className="log-msg">{log.msg}</span>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.render(<Dashboard />, document.getElementById('root'));
  </script>
</body>
</html>
