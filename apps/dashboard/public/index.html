<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Obscura Dashboard — mauvais fichier</title>
  <style>
    body {
      background: #0a0a0a;
      color: #fff;
      font-family: 'IBM Plex Mono', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .box {
      max-width: 520px;
      border: 1px solid #ffa500;
      border-radius: 8px;
      padding: 24px;
      font-size: 13px;
      line-height: 1.7;
    }
    strong { color: #ffa500; }
    code {
      background: #1a1a1a;
      padding: 2px 6px;
      border-radius: 3px;
      color: #00d9ff;
    }
  </style>
</head>
<body>
  <div class="box">
    <strong>Ce n'est pas l'application.</strong>
    <p>
      Ce fichier est une coquille vide, reste d'un ancien montage Create
      React App qui n'est plus utilisé.
    </p>
    <p>
      Le dashboard se trouve dans <code>apps/dashboard/index.html</code>.
    </p>
  </div>
</body>
</html>
